spring.application.name=librero

# ---------- Servidor ----------
# Puerto: variable de entorno LIBRERO_PORT (por defecto 8080).
server.port=${LIBRERO_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.tomcat.max-http-form-post-size=64KB

# ---------- Base de datos (SQLite) ----------
# Carpeta de datos: variable de entorno LIBRERO_DATOS (por defecto ./base-de-datos).
librero.directorio-datos=${LIBRERO_DATOS:base-de-datos}
spring.datasource.url=jdbc:sqlite:${librero.directorio-datos}/librero.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez: una conexión serializa las operaciones
# (equivale al "synchronized" de la versión anterior, pero gestionado por el pool).
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.foreign_keys=true

# ---------- JSON ----------
spring.jackson.property-naming-strategy=SNAKE_CASE
# 1.5 en un campo entero es un error, no se trunca a 1.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------- Librero ----------
librero.umbral-poco-stock=5
# Abrir el navegador al iniciar (LIBRERO_ABRIR_NAVEGADOR=false para desactivarlo).
librero.abrir-navegador=${LIBRERO_ABRIR_NAVEGADOR:true}
# Usuario y contraseña de acceso. Si LIBRERO_PASSWORD no está definida, se usa la
# contraseña guardada en la base de datos; la primera vez se genera una al azar
# y se muestra en la consola.
librero.seguridad.usuario=${LIBRERO_USUARIO:admin}
librero.seguridad.password=${LIBRERO_PASSWORD:}
# Tamaño máximo del cuerpo de una petición a la API (bytes).
librero.limite-cuerpo-bytes=65536
