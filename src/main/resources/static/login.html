<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librería · Iniciar sesión</title>
<link rel="icon" href="/img/logo-libreria.svg" type="image/svg+xml">
<link rel="stylesheet" href="/estilos.css">
<script src="/tema.js"></script>
</head>
<body>
<main class="login-pagina">
  <form class="login-caja" method="post" action="/login">
    <div class="marca">
      <span class="marca-logo"><svg class="icono"><use href="/img/iconos.svg#logo"/></svg></span>
      <div>
        <p class="marca-nombre">Librería</p>
        <p class="marca-sub">Inventario de libros</p>
      </div>
    </div>

    <h1 class="login-titulo">Bienvenido</h1>
    <p class="login-sub">Inicia sesión para continuar</p>

    <p id="login-mensaje" class="login-mensaje" role="alert"></p>
    <input type="hidden" name="_csrf" id="login-csrf">

    <div class="field">
      <label for="username">Usuario</label>
      <div class="input-icono">
        <svg class="icono"><use href="/img/iconos.svg#usuario"/></svg>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
      </div>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-principal">Entrar</button>

    <p class="login-pie">¿Olvidaste la contraseña? Reinicia Librero con la variable LIBRERO_PASSWORD.</p>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
